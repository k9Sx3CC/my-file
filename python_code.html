<script src="https://cdn.jsdelivr.net/npm/pyodide@0.26.4/pyodide.js"></script>
<script>
/* ---------- Python engine (Pyodide) ---------- */
let pyPromise=null;
function getPy(){
  if(!pyPromise){
    const st=document.getElementById('status'); st.textContent='Loading Python engine… (first run only)';
    pyPromise=loadPyodide().then(p=>{st.textContent='Python ready ✓';return p;})
      .catch(e=>{st.textContent='Could not load Python engine (check internet)';pyPromise=null;throw e;});
  }
  return pyPromise;
}
async function runCode(code,outEl){
  outEl.className='out';outEl.textContent='Running…';
  try{
    const py=await getPy();let buf='';
    py.setStdout({batched:s=>buf+=s+'\n'});py.setStderr({batched:s=>buf+=s+'\n'});
    const g=py.globals.get('dict')();
    try{py.runPython(code,{globals:g});}finally{g.destroy();}
    outEl.textContent=buf||'(no output)';
  }catch(e){
    outEl.className='out err';
    outEl.textContent=String(e.message||e).split('\n').filter(l=>!l.includes('pyodide/')&&!l.includes('_pyodide')).join('\n').trim();
  }
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function editor(code,title){
  const d=document.createElement('div');d.className='ed';
  d.innerHTML=`<div class="top"><span>${title||'Python'} — editable</span><span><button class="ghost reset">Reset</button> <button class="run">▶ Run</button></span></div><textarea spellcheck="false"></textarea><pre class="out"></pre>`;
  const ta=d.querySelector('textarea'),out=d.querySelector('.out');
  ta.value=code;const fit=()=>{ta.rows=Math.max(3,ta.value.split('\n').length)};fit();ta.addEventListener('input',fit);
  d.querySelector('.run').onclick=()=>runCode(ta.value,out);
  d.querySelector('.reset').onclick=()=>{ta.value=code;fit();out.textContent='';out.className='out'};
  ta.addEventListener('keydown',e=>{
    if(e.key==='Tab'){e.preventDefault();const s=ta.selectionStart;ta.setRangeText('    ',s,ta.selectionEnd,'end');}
    if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();d.querySelector('.run').click();}
    e.stopPropagation();
  });
  return d;
}

const S=String.raw;
const slides=[
{type:'title'},

{h:'Why choose Python over C++?',html:`
<p class="sub">Both are excellent. The question is which fits the job.</p>
<table>
<tr><th></th><th>Python</th><th>C++</th></tr>
<tr><td>Execution</td><td>Interpreted: run the file directly</td><td>Compiled: build step, then run</td></tr>
<tr><td>Typing</td><td>Dynamic (type set by the value)</td><td>Static (declare every type)</td></tr>
<tr><td>Syntax</td><td>Short, readable, indentation = blocks</td><td>Verbose: braces, semicolons, headers</td></tr>
<tr><td>Memory</td><td>Managed for you (garbage collection)</td><td>You manage it (pointers, new/delete, RAII)</td></tr>
<tr><td>Speed</td><td>Slower for raw loops</td><td>Very fast, close to hardware</td></tr>
<tr><td>Best for</td><td>Data science, ML, scripting, automation, prototyping</td><td>Embedded, games, drivers, real-time systems</td></tr>
</table>
<div class="note good">Python is usually the faster way to <b>write</b> and test an idea. C++ is usually the faster way to <b>run</b> it.</div>`},

{h:'Same task, two languages',html:`
<p class="sub">Print three lines and add two numbers.</p>
<div class="note">Python needs no headers, no <code>main()</code>, no type declarations, no semicolons.</div>
<div class="note warn">Python's speed trade-off is real, but heavy libraries (NumPy, SciPy, PyTorch) run compiled C/C++ code underneath, so you get both.</div>
<div class="note">Rule of thumb: prototype in Python; rewrite only the proven bottleneck in C++ if you need to.</div>`,
 static:`// C++ (needs compile step)
#include <iostream>
using namespace std;

int main() {
    int a = 5;
    int b = 7;
    cout << "Hello World!" << endl;
    cout << a + b << endl;
    return 0;
}`,
 code:[S`# Python (just run it)
a = 5
b = 7
print("Hello World!")
print(a + b)`]},

{h:'Running Python',html:`
<ul>
<li><b>Interactive (command line / REPL):</b> type <code>python</code>, then statements run immediately.</li>
<li><b>Script file:</b> save as <code>myfile.py</code> and run <code>python myfile.py</code></li>
<li>In this deck, press <b>▶ Run</b> on any code box. You can edit the code first.</li>
</ul>
<div class="note">Command line style: <code>&gt;&gt;&gt; print("Hello, World!")</code> prints <code>Hello, World!</code></div>`,
 code:[S`print("Hello, World!")`]},

{h:'Indentation matters',html:`
<ul>
<li>Indentation = spaces at the start of a line.</li>
<li>In many languages it is only for readability. <b>In Python it defines the code block.</b></li>
<li>Be consistent: use the same number of spaces (4 is the convention) within a block.</li>
</ul>
<div class="note warn">Try it: delete the spaces before the second <code>print</code> and Run. Python raises an <code>IndentationError</code>.</div>`,
 code:[S`x = 5
if x > 2:
    print("Five is greater than two!")
    print("Still inside the block")
print("Outside the block")`]},

{h:'Statements',html:`
<ul>
<li>A program is a list of instructions. Each instruction is a <b>statement</b>.</li>
<li>A statement usually ends when the <b>line ends</b>. No <code>;</code> needed (unlike Java, C, C++).</li>
<li>Statements run one by one, in the order written.</li>
</ul>`,
 code:[S`print("Hello World!")
print("Have a good day.")
print("Learning Python is fun!")`]},

{h:'Semicolons (optional, rarely used)',html:`
<ul>
<li>You <i>can</i> put several statements on one line with <code>;</code>, but it hurts readability.</li>
<li>Two statements on one line with <b>no</b> separator is a <code>SyntaxError</code>.</li>
</ul>`,
 code:[S`print("Hello"); print("How are you?"); print("Bye bye!")`,
       S`# Remove the semicolon and Run: Python gives an error
print("Hello") print("Oops")`]},

{h:'print(): end, numbers, mixing',html:`
<ul>
<li><code>print()</code> ends with a new line by default. Use <code>end=</code> to change that.</li>
<li>Numbers go <b>without</b> quotes.</li>
<li>Mix text and numbers by separating with commas.</li>
</ul>`,
 code:[S`print("Hello World!", end=" ")
print("I will print on the same line.")`,
       S`print(3)
print(358)
print(50000)
print("I am", 35, "years old.")`]},

{h:'Comments',html:`
<ul>
<li>Start with <code>#</code>. Python ignores the rest of the line.</li>
<li>Uses: explain code, make it readable, <b>disable code while testing</b>.</li>
<li>Multi-line: one <code>#</code> per line, or an unassigned triple-quoted string.</li>
</ul>
<div class="note">Strictly, the triple-quoted string is not a comment. It is a string literal Python evaluates and discards. Docstrings use the same syntax.</div>`,

written in
more than just one line
"""

{h:'Variables',html:`
<ul>
<li>Containers for storing data values.</li>
<li>No declaration command. A variable is <b>created when you first assign</b> a value.</li>
<li>Type can change after assignment (dynamic typing).</li>
<li>Single or double quotes both work for strings.</li>
<li>Names are <b>case-sensitive</b>: <code>a</code> and <code>A</code> are different.</li>
</ul>`,

{h:'Casting and type()',html:`
<ul>
<li>Casting specifies a type using constructor functions: <code>int()</code>, <code>float()</code>, <code>str()</code>.</li>
<li><code>type()</code> tells you the type of any value.</li>
</ul>`,

<ul>
<li>Must start with a <b>letter or underscore</b></li>
<li>Cannot start with a number</li>
<li>Only letters, digits, underscore</li>
<li>Case-sensitive; cannot be a Python keyword</li>
</ul>
<p><span class="tag">camelCase</span><span class="tag">PascalCase</span><span class="tag">snake_case</span></p>
<div class="note good">Python style (PEP 8) prefers <b>snake_case</b> for variables and functions.</div>`,

{h:'Assigning many values',html:`
<ul>
<li><b>Many values → many variables</b> in one line.</li>
<li><b>One value → many variables.</b></li>

{h:'Output variables',html:`
<ul>
<li>Comma separates values and works with any types.</li>

</ul>`,

{h:'Global and local variables',html:`
<ul>
<li>Created <b>outside</b> a function = global (readable everywhere).</li>
<li>Same name <b>inside</b> a function = a new local variable; the global is unchanged.</li>
<li><code>global</code> keyword creates or changes a global from inside a function.</li>
</ul>`,

<ul>

{h:'String slicing',html:`
<ul>
<li><code>s[start:end]</code>: <b>end is not included</b>.</li>

<tr><td><code>\\n</code></td><td>New line</td></tr>
<tr><td><code>\\t</code></td><td>Tab</td></tr>
<tr><td><code>\\r \\b \\f</code></td><td>Carriage return, backspace, form feed</td></tr>
<tr><td><code>\\ooo \\xhh</code></td><td>Octal / hex value</td></tr>
</table>`,

{h:'Identity and membership operators',html:`
<ul>
<li><code>is</code> / <code>is not</code>: <b>same object in memory?</b></li>
<li><code>==</code>: <b>equal values?</b></li>
<li><code>in</code> / <code>not in</code>: is a value present in a sequence?</li>
</ul>
<div class="note warn">Common mistake: using <code>is</code> to compare values. Use <code>==</code> for values.</div>`,
 code:[S`x = ["apple", "banana"]
y = ["apple", "banana"]
z = x
print(x is z)     # True: same object
print(x is y)     # False: equal but separate objects
print(x == y)     # True: equal values

fruits = ["apple", "banana", "cherry"]
print("banana" in fruits)
print("pineapple" not in fruits)
text = "Hello World"
print("H" in text, "hello" in text, "z" not in text)`]},

{h:'Bitwise operators',html:`
<table>
<tr><th>Op</th><th>Name</th><th>Meaning</th></tr>
<tr><td><code>&amp;</code></td><td>AND</td><td>1 if both bits are 1</td></tr>
<tr><td><code>|</code></td><td>OR</td><td>1 if either bit is 1</td></tr>
<tr><td><code>^</code></td><td>XOR</td><td>1 if only one bit is 1</td></tr>
<tr><td><code>~</code></td><td>NOT</td><td>Inverts all bits</td></tr>
<tr><td><code>&lt;&lt;</code></td><td>Left shift</td><td>Push zeros in from the right</td></tr>
<tr><td><code>&gt;&gt;</code></td><td>Right shift</td><td>Push sign bit in from the left</td></tr>
</table>`,
 code:[S`print(f"{6:04b} & {3:04b} = {6 & 3:04b} ({6 & 3})")
print(f"{6:04b} | {3:04b} = {6 | 3:04b} ({6 | 3})")
print(f"{6:04b} ^ {3:04b} = {6 ^ 3:04b} ({6 ^ 3})")
print(3 << 2, 12 >> 2, ~5)`]},

{h:'Operator precedence and the ternary',html:`
<ul>
<li>Order (high → low): <code>()</code> → <code>**</code> → unary <code>+x -x ~x</code> → <code>* / // %</code> → <code>+ -</code> → shifts → <code>&amp;</code> → <code>^</code> → <code>|</code> → comparisons/identity/membership → <code>not</code> → <code>and</code> → <code>or</code></li>
<li>Same precedence: left to right.</li>
<li><b>Ternary</b> (conditional expression): <code>a if condition else b</code></li>
</ul>
<div class="note good">When in doubt, add parentheses. It is clearer for the reader.</div>`,
 code:[S`print((6 + 3) - (6 + 3))
print(100 + 5 * 3)
print(5 + 4 - 7 + 3)

num = 6
x = "WEEKEND!" if num > 5 else "Workday"
print(x)

x = "Fri" if num == 5 else "Sat" if num == 6 else "Sun" if num == 7 else "weekday"
print(x)`]},

{h:'Lists',html:`
<ul>
<li>Store multiple items in <b>one variable</b>. Created with <code>[ ]</code>.</li>
<li><b>Ordered, changeable, allow duplicates.</b> Indexed from 0.</li>
<li>Items can be <b>any type, mixed</b>. <code>len()</code> gives size.</li>
<li>Also: <code>list(("a","b"))</code> constructor (note double brackets).</li>
</ul>`,
 code:[S`thislist = ["apple", "banana", "cherry", "apple", "cherry"]
print(thislist)
print(len(thislist))

mixed = ["abc", 34, True, 40, "male"]
print(mixed, type(mixed))

print(list(("apple", "banana", "cherry")))`]},

{h:'Collections: choosing the right one',html:`
<p class="sub">Added slide. Summarises the four collection types the material mentions.</p>
<table>
<tr><th>Type</th><th>Syntax</th><th>Ordered</th><th>Changeable</th><th>Duplicates</th></tr>
<tr><td>List</td><td><code>[ ]</code></td><td>Yes</td><td>Yes</td><td>Yes</td></tr>
<tr><td>Tuple</td><td><code>( )</code></td><td>Yes</td><td>No</td><td>Yes</td></tr>
<tr><td>Set</td><td><code>{ }</code></td><td>No</td><td>Items fixed, but add/remove OK</td><td>No</td></tr>
<tr><td>Dict</td><td><code>{k: v}</code></td><td>Yes (3.7+)</td><td>Yes</td><td>Keys: No</td></tr>
</table>`,
 code:[S`print(["a", "b", "a"])           # list keeps duplicates
print(("a", "b", "a"))           # tuple too, but immutable
print({"a", "b", "a"})           # set drops duplicates
print({"name": "John", "age": 36})

t = ("a", "b")
# t[0] = "z"     # TypeError: tuples can't change`]},

{h:'Access list items',html:`
<ul>
<li>By index: <code>list[1]</code>. Negative index counts from the end (<code>-1</code> = last).</li>
<li>Ranges: <code>list[2:5]</code> (end not included); leave out start or end.</li>
<li>Check existence with <code>in</code>.</li>
</ul>`,
 code:[S`thislist = ["apple", "banana", "cherry", "orange", "kiwi", "melon", "mango"]
print(thislist[1])
print(thislist[-1])
print(thislist[2:5])
print(thislist[:4])
print(thislist[2:])
print(thislist[-4:-1])
if "apple" in thislist:
    print("Yes, 'apple' is in the fruits list")`]},

{h:'Change list items',html:`
<ul>
<li>Change one item by index; replace a <b>range</b> with a new list.</li>
<li>If counts differ, the list length changes.</li>
</ul>`,
 code:[S`thislist = ["apple", "banana", "cherry"]
thislist[1] = "blackcurrant"
print(thislist)

a = ["apple", "banana", "cherry", "orange", "kiwi", "mango"]
a[1:3] = ["blackcurrant", "watermelon"]
print(a)

b = ["apple", "banana", "cherry"]
b[1:2] = ["blackcurrant", "watermelon"]   # 1 replaced by 2
print(b)

c = ["apple", "banana", "cherry"]
c[1:3] = ["watermelon"]                   # 2 replaced by 1
print(c)`]},

{h:'Add list items',html:`
<ul>
<li><code>append(x)</code>: add to the <b>end</b>.</li>
<li><code>insert(i, x)</code>: add at an index.</li>
<li><code>extend(iterable)</code>: add all elements of another list, tuple, set…</li>
</ul>`,
 code:[S`thislist = ["apple", "banana", "cherry"]
thislist.append("orange")
print(thislist)

thislist.insert(1, "kiwi")
print(thislist)

tropical = ["mango", "pineapple", "papaya"]
thislist.extend(tropical)
print(thislist)

thislist.extend(("lime", "lemon"))   # a tuple works too
print(thislist)`]},

{h:'Remove list items',html:`
<ul>
<li><code>remove(x)</code>: removes the <b>first</b> matching value.</li>
<li><code>pop(i)</code>: removes index <code>i</code>; no argument = last item (and returns it).</li>
<li><code>del list[i]</code>: removes by index; <code>del list</code> deletes the whole list.</li>
<li><code>clear()</code>: empties the list but keeps it.</li>
</ul>`,
 code:[S`a = ["apple", "banana", "cherry", "banana", "kiwi"]
a.remove("banana")       # first one only
print(a)

b = ["apple", "banana", "cherry"]
print(b.pop(1), b)
print(b.pop(), b)

c = ["apple", "banana", "cherry"]
del c[0]
print(c)

d = ["apple", "banana", "cherry"]
d.clear()
print(d)`]},

{h:'Summary',html:`
<ul>
<li>Python: readable, dynamic, interpreted. Great for fast development; pair with C/C++ libraries when speed matters.</li>
<li><b>Indentation is syntax.</b> One statement per line; no semicolons.</li>
<li>Variables are created on assignment; types are dynamic; use <code>type()</code> and casting.</li>

</ul>
